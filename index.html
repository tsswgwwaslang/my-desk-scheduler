<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 데스크 플래너</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #f5f2eb; }
    </style>
</head>
<body class="flex flex-col items-center justify-start min-h-screen p-4">

    <!-- 로그인 모달 -->
    <div id="auth-modal" class="fixed inset-0 bg-black/40 flex items-center justify-center z-50">
        <div class="bg-[#fcfbfa] p-8 rounded-2xl shadow-xl w-96 text-center border border-[#e3ded6]">
            <h2 class="text-xl font-bold mb-2 text-[#4a453e]">데스크 플래너 로그인</h2>
            <p class="text-xs text-[#8c857b] mb-6">기기 간 실시간 동기화를 위해 로그인해 주세요.</p>
            
            <input type="email" id="email" placeholder="이메일" class="w-full mb-3 px-4 py-2.5 rounded-xl border border-[#d6cfc7] bg-white text-sm focus:outline-none focus:border-[#b8afa6]">
            <input type="password" id="password" placeholder="비밀번호 (6자리 이상)" class="w-full mb-6 px-4 py-2.5 rounded-xl border border-[#d6cfc7] bg-white text-sm focus:outline-none focus:border-[#b8afa6]">
            
            <div class="flex gap-2">
                <button id="login-btn" class="flex-1 py-2.5 bg-[#d4b08c] text-white rounded-xl font-medium text-sm hover:bg-[#c29e79] transition">로그인</button>
                <button id="signup-btn" class="flex-1 py-2.5 bg-[#e6e2db] text-[#5c554b] rounded-xl font-medium text-sm hover:bg-[#ded9d0] transition">회원가입</button>
            </div>
        </div>
    </div>

    <!-- 메인 앱 컨테이너 (로그인 전에는 숨김) -->
    <div id="app-content" class="hidden w-full max-w-4xl">
        <!-- 상단 내비게이션 바 -->
        <div class="flex justify-end gap-2 mb-4">
            <span id="user-email-display" class="text-xs text-[#8c857b] self-center mr-2"></span>
            <button id="logout-btn" class="px-3 py-1.5 bg-[#e6e2db] text-[#5c554b] rounded-lg text-xs font-medium hover:bg-[#ded9d0]">로그아웃</button>
        </div>

        <!-- 스케줄러 메인 화면 -->
        <div class="bg-[#fcfbfa] p-6 rounded-3xl shadow-sm border border-[#e3ded6]">
            <h1 class="text-xl font-bold text-[#4a453e] mb-1">오늘의 스케줄</h1>
            <p class="text-xs text-[#8c857b] mb-6">오늘 하루도 알차고 보람차게 보내세요.</p>
            
            <!-- 할 일 입력 영역 -->
            <div class="flex gap-2 mb-6">
                <input type="text" id="todo-input" placeholder="새로운 할 일을 입력하세요..." class="flex-1 px-4 py-2.5 rounded-xl border border-[#d6cfc7] bg-white text-sm focus:outline-none focus:border-[#b8afa6]">
                <button id="add-todo-btn" class="px-6 py-2.5 bg-[#d4b08c] text-white rounded-xl font-medium text-sm hover:bg-[#c29e79] transition">추가</button>
            </div>

            <!-- 할 일 목록 영역 -->
            <ul id="todo-list" class="space-y-2">
                <!-- 동적으로 할 일이 추가되는 곳 -->
            </ul>
        </div>
    </div>

    <!-- 파이어베이스 및 앱 로직 스크립트 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 👉 본인의 파이어베이스 설정값으로 교체하세요!
        const firebaseConfig = {
            apiKey: "본인의_API_KEY",
            authDomain: "본인의_AUTH_DOMAIN",
            projectId: "본인의_PROJECT_ID",
            storageBucket: "본인의_STORAGE_BUCKET",
            messagingSenderId: "본인의_MESSAGING_SENDER_ID",
            appId: "본인의_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const authModal = document.getElementById('auth-modal');
        const appContent = document.getElementById('app-content');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const userEmailDisplay = document.getElementById('user-email-display');
        const todoInput = document.getElementById('todo-input');
        const todoList = document.getElementById('todo-list');

        let unsubscribe = null;

        // 로그인 상태 감지
        onAuthStateChanged(auth, (user) => {
            if (user) {
                authModal.classList.add('hidden');
                appContent.classList.remove('hidden');
                userEmailDisplay.textContent = `${user.email} 님`;
                loadTodos(user.uid);
            } else {
                authModal.classList.remove('hidden');
                appContent.classList.add('hidden');
                if (unsubscribe) unsubscribe();
            }
        });

        // 회원가입 버튼
        document.getElementById('signup-btn').addEventListener('click', async () => {
            try {
                await createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
                alert('회원가입 및 로그인 성공!');
            } catch (error) {
                alert('회원가입 실패: ' + error.message);
            }
        });

        // 로그인 버튼
        document.getElementById('login-btn').addEventListener('click', async () => {
            try {
                await signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
            } catch (error) {
                alert('로그인 실패: ' + error.message);
            }
        });

        // 로그아웃 버튼
        document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth);
        });

        // 할 일 실시간 불러오기
        function loadTodos(uid) {
            const q = query(collection(db, "todos"), where("uid", "==", uid));
            unsubscribe = onSnapshot(q, (snapshot) => {
                todoList.innerHTML = "";
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const li = document.createElement('li');
                    li.className = "flex justify-between items-center px-4 py-3 bg-white rounded-xl border border-[#e3ded6] text-sm text-[#4a453e]";
                    li.innerHTML = `
                        <span>${data.text}</span>
                        <button onclick="deleteTodo('${docSnap.id}')" class="text-xs text-[#a89f91] hover:text-red-500">삭제</button>
                    `;
                    todoList.appendChild(li);
                });
            });
        }

        // 할 일 추가 버튼
        document.getElementById('add-todo-btn').addEventListener('click', async () => {
            const text = todoInput.value.trim();
            if (!text) return;
            if (!auth.currentUser) return;

            try {
                await addDoc(collection(db, "todos"), {
                    text: text,
                    uid: auth.currentUser.uid,
                    createdAt: new Date()
                });
                todoInput.value = "";
            } catch (error) {
                alert('할 일 추가 실패: ' + error.message);
            }
        });

        // 할 일 삭제 함수 (전역 등록)
        window.deleteTodo = async function(id) {
            try {
                await deleteDoc(doc(db, "todos", id));
            } catch (error) {
                alert('삭제 실패: ' + error.message);
            }
        }
    </script>
</body>
</html>
