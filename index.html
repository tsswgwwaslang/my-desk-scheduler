<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cozy Desk Planner</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts: 둥근 모던 폰트 (Gowun Dodum) -->
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Gowun Dodum', sans-serif;
            background-color: #f7f4ed;
            color: #4a403a;
        }
        /* 커스텀 스크롤바 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1ede4;
        }
        ::-webkit-scrollbar-thumb {
            background: #d8cebc;
            border-radius: 3px;
        }
        /* 부드러운 전환 효과 */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* 커피 김 모락모락 애니메이션 */
        @keyframes steam {
            0% { transform: translateY(0) scaleX(1); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-15px) scaleX(1.5); opacity: 0; }
        }
        .steam-1 { animation: steam 2s infinite ease-out; }
        .steam-2 { animation: steam 2s infinite ease-out 1s; }
        
        /* 통통 튀는 아이콘 효과 */
        .desk-icon {
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .desk-icon:hover {
            transform: translateY(-5px) scale(1.08);
        }
        .desk-icon:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-3 sm:p-6 select-none">

    <!-- 상단 데스크 소품 내비게이션 (오피스 테마 아이콘 바) -->
    <header class="w-full max-w-2xl bg-[#eee8dc] border border-[#d8cebc] shadow-sm rounded-2xl p-3 mb-4 flex items-center justify-around">
        <button onclick="switchTab('todos')" id="nav-todos" class="desk-icon flex flex-col items-center cursor-pointer px-3 py-1.5 rounded-xl transition-all bg-[#e3dad0] shadow-xs">
            <span class="text-2xl mb-0.5">📅</span>
            <span class="text-xs font-bold text-[#63554b]">플래너</span>
        </button>
        <button onclick="switchTab('calendar')" id="nav-calendar" class="desk-icon flex flex-col items-center cursor-pointer px-3 py-1.5 rounded-xl transition-all hover:bg-[#e8dfd3]">
            <span class="text-2xl mb-0.5">🗓️</span>
            <span class="text-xs font-medium text-[#7c6c60]">탁상달력</span>
        </button>
        <button onclick="switchTab('pomodoro')" id="nav-pomodoro" class="desk-icon flex flex-col items-center cursor-pointer px-3 py-1.5 rounded-xl transition-all hover:bg-[#e8dfd3]">
            <span class="text-2xl mb-0.5">☕</span>
            <span class="text-xs font-medium text-[#7c6c60]">커피타임</span>
        </button>
        <button onclick="switchTab('memo')" id="nav-memo" class="desk-icon flex flex-col items-center cursor-pointer px-3 py-1.5 rounded-xl transition-all hover:bg-[#e8dfd3]">
            <span class="text-2xl mb-0.5">📌</span>
            <span class="text-xs font-medium text-[#7c6c60]">코르크보드</span>
        </button>
        <button onclick="switchTab('settings')" id="nav-settings" class="desk-icon flex flex-col items-center cursor-pointer px-3 py-1.5 rounded-xl transition-all hover:bg-[#e8dfd3]">
            <span class="text-2xl mb-0.5">⚙️</span>
            <span class="text-xs font-medium text-[#7c6c60]">데스크정돈</span>
        </button>
    </header>

    <!-- 메인 컨텐츠 영역 -->
    <main class="w-full max-w-2xl bg-white/90 backdrop-blur-sm border border-[#e5ded0] rounded-3xl shadow-md p-5 sm:p-8 flex-1 flex flex-col mb-4">

        <!-- 1
