<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cozy Desk Planner (Cloud Sync)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase 설정 (사진 속 고유 키값 자동 반영 완료)
        const firebaseConfig = {
            apiKey: "AIzaSyCp5UJ-jT6ly6KDYOCaj8b8X-FueW5y44Q",
            authDomain: "my-desk-scheduler.firebaseapp.com",
            projectId: "my-desk-scheduler",
            storageBucket: "my-desk-scheduler.firebasestorage.app",
            messagingSenderId: "845280282739",
            appId: "1:845280282739:web:702fc37399574e8d83c206",
            measurementId: "G-PPY1S5K2MC"
        };

        // 초기화
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 전역 함수 연결
        window.firebaseAuth = auth;
        window.firebaseDb = db;
        window.signInWithEmailAndPassword = signInWithEmailAndPassword;
        window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
        window.signOut = signOut;
        window.doc = doc;
        window.setDoc = setDoc;
        window.onSnapshot = onSnapshot;

        // 로그인 상태 감지
        onAuthStateChanged(auth, (user) => {
            const authModal = document.getElementById('auth-modal');
            const userEmailDisplay = document.getElementById('user-email-display');
            if (user) {
                authModal.classList.add('hidden');
                userEmailDisplay.innerText = user.email;
                loadUserData(user.uid);
            } else {
                authModal.classList.remove('hidden');
                userEmailDisplay.innerText = '';
            }
        });
    </script>
    <style>
        body { font-family: 'Gowun Dodum', sans-serif; background-color: #f7f4ed; color: #4a403a; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1ede4; }
        ::-webkit-scrollbar-thumb { background: #d8cebc; border-radius: 3px; }
        .fade-in { animation: fadeIn 0.3s ease-in-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes steam {
            0% { transform: translateY(0) scaleX(1); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-15px) scaleX(1.5); opacity: 0; }
        }
        .steam-1 { animation: steam 2s infinite ease-out; }
        .steam-2 { animation: steam 2s infinite ease-out 1s; }
        .desk-icon { transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .desk-icon:hover { transform: translateY(-5px) scale(1.08); }
        .desk-icon:active { transform: scale(0.95); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-3 sm:p-6 select-none relative">

    <!-- 로그인/회원가입 모달 -->
    <div id="auth-modal" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-sm w-full shadow-xl border border-[#e5ded0] space-y-4 text-center">
            <div class="text-3xl mb-1">☕</div>
            <h2 class="text-xl font-bold text-[#4a403a]">데스크 플래너 로그인</h2>
            <p class="text-xs text-[#8c7b6f]">기기 간 실시간 동기화를 위해 로그인해 주세요.</p>
            
            <div class="space-y-3 pt-2 text-left">
                <input type="email" id="auth-email" placeholder="이메일 주소" class="w-full bg-[#faf8f5] border border-[#e5ded0] rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#d4a373]">
                <input type="password" id="auth-password" placeholder="비밀번호 (6자리 이상)" class="w-full bg-[#faf8f5] border border-[#e5ded0] rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#d4a373]">
            </div>

            <div class="flex gap-2 pt-2">
                <button onclick="handleLogin()" class="flex-1 bg-[#d4a373] hover:bg-[#bc8a5f] text-white font-medium py-3 rounded-xl text-sm transition-all cursor-pointer shadow-xs">로그인</button>
                <button onclick="handleSignup()" class="flex-1 bg-[#e5ded0] hover:bg-[#d8cebc] text-[#63554b] font-medium py-3 rounded-xl text-sm transition-all cursor-pointer">회원가입</button>
            </div>
            <p id="auth-error" class="text-xs text-rose-500 h-4"></p>
        </div>
    </div>

    <!-- 상단 내비게이션 -->
    <header class="w-full max-w-2xl bg-[#eee8dc] border border-[#d8cebc] shadow-sm rounded-2xl p-3 mb-4 flex items-center justify-around">
        <button onclick="switchTab('todos')" id="nav-todos" class="desk-icon flex flex-col items-center cursor-pointer px-3 py-1.5 rounded-xl transition-all bg-[#e3dad0] shadow-xs">
            <span class="text-2xl mb-0.5">📅</span>
            <span class="text-xs font-bold text-[#63554b]">플래너</span>
        </button>
        <button onclick="switchTab('calendar')" id="nav-calendar" class="desk-icon flex flex-col items-center cursor-pointer px-3 py-1.5 rounded-xl transition-all hover:bg-[#e8dfd3]">
            <span class="text-2xl mb-0.5">🗓️</span>
            <span class="text-xs font-medium text-[#7c6c60]">탁상달력</span>
        </button>
        <button onclick="switchTab('pomodoro')" id="nav-pomodoro" class="desk-icon flex flex-col items-center cursor-pointer px-3 py-1.5 rounded-xl transition-all hover:bg-[#e8dfd3]">
            <span class="text-2xl mb-0.5">☕</span>
            <span class="text-xs font-medium text-[#7c6c60]">커피타임</span>
        </button>
        <button onclick="switchTab('memo')" id="nav-memo" class="desk-icon flex flex-col items-center cursor-pointer px-3 py-1.5 rounded-xl transition-all hover:bg-[#e8dfd3]">
            <span class="text-2xl mb-0.5">📌</span>
            <span class="text-xs font-medium text-[#7c6c60]">코르크보드</span>
        </button>
        <button onclick="switchTab('settings')" id="nav-settings" class="desk-icon flex flex-col items-center cursor-pointer px-3 py-1.5 rounded-xl transition-all hover:bg-[#e8dfd3]">
            <span class="text-2xl mb-0.5">⚙️</span>
            <span class="text-xs font-medium text-[#7c6c60]">계정설정</span>
        </button>
    </header>

    <!-- 메인 영역 -->
    <main class="w-full max-w-2xl bg-white/90 backdrop-blur-sm border border-[#e5ded0] rounded-3xl shadow-md p-5 sm:p-8 flex-1 flex flex-col mb-4">

        <!-- 1. 플래너 탭 -->
        <section id="tab-todos" class="tab-content flex-1 flex flex-col fade-in">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between pb-4 mb-5 border-b border-[#f0ebe1] gap-2">
                <div>
                    <h1 id="current-date-title" class="text-xl font-bold text-[#4a403a]">오늘의 스케줄</h1>
                    <p class="text-xs text-[#8c7b6f] mt-0.5">실시간 클라우드 동기화 모드</p>
                </div>
                <div class="bg-[#f7f4ed] px-3.5 py-2 rounded-xl flex items-center gap-3 border border-[#ede6da]">
                    <div class="text-right">
                        <div class="text-xs font-medium text-[#7c6c60]">달성률</div>
                        <div id="progress-text" class="text-sm font-bold text-[#b8865a]">0%</div>
                    </div>
                    <div class="w-24 h-2.5 bg-[#e5ded0] rounded-full overflow-hidden">
                        <div id="progress-bar" class="h-full bg-[#d4a373] transition-all duration-300 rounded-full" style="width: 0%;"></div>
                    </div>
                </div>
            </div>

            <form id="todo-form" class="space-y-3 mb-6">
                <div class="flex gap-2">
                    <input type="text" id="todo-input" placeholder="어떤 일을 완료할까요?" autocomplete="off"
                        class="flex-1 bg-[#faf8f5] border border-[#e5ded0] rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#d4a373]">
                    <button type="submit" class="bg-[#d4a373] hover:bg-[#bc8a5f] text-white font-medium px-5 py-3 rounded-xl text-sm transition-all shadow-xs cursor-pointer flex items-center gap-1">
                        <span>추가</span><span>✏️</span>
                    </button>
                </div>
                <div class="flex flex-wrap items-center justify-between gap-2 text-xs">
                    <div class="flex items-center gap-2">
                        <span class="text-[#8c7b6f]">카테고리:</span>
                        <select id="todo-category" class="bg-[#faf8f5] border border-[#e5ded0] rounded-lg px-2.5 py-1.5 text-xs text-[#63554b] focus:outline-none focus:border-[#d4a373]">
                            <option value="업무">💼 업무</option>
                            <option value="개인">🌱 개인</option>
                            <option value="루틴">☕ 루틴</option>
                            <option value="긴급">🔥 긴급</option>
                        </select>
                        <label class="flex items-center gap-1.5 cursor-pointer ml-2">
                            <input type="checkbox" id="todo-important" class="rounded border-[#d8cebc] text-[#d4a373] focus:ring-0 w-3.5 h-3.5">
                            <span class="text-[#8c7b6f]">중요 ⭐</span>
                        </label>
                    </div>
                    <div class="flex gap-1">
                        <button type="button" onclick="setFilter('all')" id="filter-all" class="filter-btn px-2.5 py-1 rounded-lg bg-[#e3dad0] text-[#63554b] font-medium transition-all">전체</button>
                        <button type="button" onclick="setFilter('active')" id="filter-active" class="filter-btn px-2.5 py-1 rounded-lg hover:bg-[#f0ebe1] text-[#8c7b6f] transition-all">진행중</button>
                        <button type="button" onclick="setFilter('completed')" id="filter-completed" class="filter-btn px-2.5 py-1 rounded-lg hover:bg-[#f0ebe1] text-[#8c7b6f] transition-all">완료</button>
                    </div>
                </div>
            </form>

            <div class="flex-1 overflow-y-auto space-y-2.5 min-h-[220px] max-h-[360px] pr-1" id="todo-list"></div>
        </section>

        <!-- 2. 탁상달력 탭 -->
        <section id="tab-calendar" class="tab-content hidden flex-1 flex flex-col fade-in">
            <div class="flex items-center justify-between mb-4 pb-3 border-b border-[#f0ebe1]">
                <div class="flex items-center gap-2">
                    <span class="text-xl">🗓️</span>
                    <h2 id="cal-month-title" class="text-lg font-bold text-[#4a403a]"></h2>
                </div>
                <div class="flex gap-1">
                    <button onclick="changeMonth(-1)" class="p-2 rounded-xl bg-[#f7f4ed] hover:bg-[#eedecc] text-xs font-bold text-[#63554b] cursor-pointer">◀ 이전</button>
                    <button onclick="changeMonth(1)" class="p-2 rounded-xl bg-[#f7f4ed] hover:bg-[#eedecc] text-xs font-bold text-[#63554b] cursor-pointer">다음 ▶</button>
                </div>
            </div>
            <div class="grid grid-cols-7 text-center text-xs font-bold text-[#8c7b6f] mb-2">
                <span class="text-rose-500">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="text-blue-500">토</span>
            </div>
            <div id="cal-days-grid" class="grid grid-cols-7 gap-1.5 flex-1 text-xs"></div>
        </section>

        <!-- 3. 커피타임 탭 -->
        <section id="tab-pomodoro" class="tab-content hidden flex-1 flex flex-col items-center justify-center text-center fade-in py-6">
            <div class="relative mb-6">
                <div class="absolute -top-7 left-1/2 -translate-x-1/2 flex gap-2">
                    <div class="w-1.5 h-6 bg-[#d4a373]/50 rounded-full steam-1"></div>
                    <div class="w-1.5 h-6 bg-[#d4a373]/50 rounded-full steam-2"></div>
                </div>
                <div class="w-28 h-28 bg-[#f7f4ed] border-2 border-[#e5ded0] rounded-full flex items-center justify-center text-5xl shadow-inner">☕</div>
            </div>
            <div class="text-sm font-bold text-[#b8865a] mb-2 uppercase tracking-wide">집중 시간 (Focus Time)</div>
            <div id="pomo-timer" class="text-5xl font-extrabold text-[#4a403a] mb-6 tracking-tight">25:00</div>
            <div class="flex gap-3">
                <button onclick="togglePomodoro()" id="pomo-start-btn" class="bg-[#d4a373] hover:bg-[#bc8a5f] text-white font-medium px-6 py-2.5 rounded-xl text-sm transition-all shadow-xs cursor-pointer">타이머 시작</button>
                <button onclick="resetPomodoro()" class="bg-[#e5ded0] hover:bg-[#d8cebc] text-[#63554b] font-medium px-5 py-2.5 rounded-xl text-sm transition-all cursor-pointer">초기화</button>
            </div>
        </section>

        <!-- 4. 코르크보드 탭 -->
        <section id="tab-memo" class="tab-content hidden flex-1 flex flex-col fade-in">
            <div class="flex items-center justify-between mb-4 pb-3 border-b border-[#f0ebe1]">
                <div class="flex items-center gap-2">
                    <span class="text-xl">📌</span>
                    <h2 class="text-lg font-bold text-[#4a403a]">코르크 보드 메모</h2>
                </div>
                <button onclick="addMemo()" class="bg-[#d4a373] hover:bg-[#bc8a5f] text-white text-xs font-medium px-3.5 py-2 rounded-xl transition-all cursor-pointer shadow-xs">+ 포스트잇 붙이기</button>
            </div>
            <div id="memo-board" class="flex-1 overflow-y-auto grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-[360px] pr-1"></div>
        </section>

        <!-- 5. 계정설정 탭 -->
        <section id="tab-settings" class="tab-content hidden flex-1 flex flex-col fade-in space-y-4">
            <div class="pb-3 border-b border-[#f0ebe1]">
                <h2 class="text-lg font-bold text-[#4a403a]">계정 및 동기화 설정</h2>
                <p class="text-xs text-[#8c7b6f] mt-0.5">현재 접속 중인 계정 정보입니다.</p>
            </div>
            <div class="bg-[#f7f4ed] p-4 rounded-2xl border border-[#ede6da] space-y-2">
                <div class="text-xs text-[#8c7b6f]">로그인된 이메일</div>
                <div id="user-email-display" class="text-sm font-bold text-[#63554b]"></div>
            </div>
            <div class="pt-2">
                <button onclick="handleLogout()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 text-xs font-medium px-4 py-2.5 rounded-xl transition-all cursor-pointer">
                    로그아웃 하기
                </button>
            </div>
        </section>

    </main>

    <footer class="text-center text-xs text-[#9c8b7f]">
        <p>My Cozy Desk Schedule • Realtime Cloud Connected</p>
    </footer>

    <!-- Script Logic -->
    <script>
        let todos = [], memos = [], currentFilter = 'all', currentCalDate = new Date();
        let unsubTodos = null, unsubMemos = null;

        function switchTab(tabId) {
            ['todos', 'calendar', 'pomodoro', 'memo', 'settings'].forEach(t => {
                const content = document.getElementById(`tab-${t}`);
                const nav = document.getElementById(`nav-${t}`);
                if (t === tabId) {
                    content.classList.remove('hidden');
                    nav.classList.add('bg-[#e3dad0]', 'shadow-xs');
                    nav.classList.remove('hover:bg-[#e8dfd3]');
                    nav.querySelector('span:last-child').className = 'text-xs font-bold text-[#63554b]';
                } else {
                    content.classList.add('hidden');
                    nav.classList.remove('bg-[#e3dad0]', 'shadow-xs');
                    nav.classList.add('hover:bg-[#e8dfd3]');
                    nav.querySelector('span:last-child').className = 'text-xs font-medium text-[#7c6c60]';
                }
            });
            if (tabId === 'calendar') renderCalendar();
            if (tabId === 'memo') renderMemos();
        }

        async function handleLogin() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const errEl = document.getElementById('auth-error');
            try {
                await window.signInWithEmailAndPassword(window.firebaseAuth, email, password);
                errEl.innerText = '';
            } catch (err) {
                errEl.innerText = '로그인 실패: 이메일과 비밀번호를 확인해주세요.';
            }
        }

        async function handleSignup() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const errEl = document.getElementById('auth-error');
            try {
                await window.createUserWithEmailAndPassword(window.firebaseAuth, email, password);
                errEl.innerText = '';
            } catch (err) {
                errEl.innerText = '회원가입 실패: 6자 이상 비밀번호를 입력해주세요.';
            }
        }

        async function handleLogout() { await window.signOut(window.firebaseAuth); }

        function loadUserData(uid) {
            const db = window.firebaseDb;
            if (unsubTodos) unsubTodos();
            unsubTodos = window.onSnapshot(window.doc(db, 'users', uid, 'data', 'todos'), (docSnap) => {
                todos = docSnap.exists() ? (docSnap.data().items || []) : [{ id: 1, text: '아침 커피와 함께 플래너 시작하기', category: '루틴', important: true, completed: false }];
                if (!docSnap.exists()) saveTodosToFirebase();
                renderTodos();
            });

            if (unsubMemos) unsubMemos();
            unsubMemos = window.onSnapshot(window.doc(db, 'users', uid, 'data', 'memos'), (docSnap) => {
                memos = docSnap.exists() ? (docSnap.data().items || []) : [{ id: 1, text: '💡 실시간 연동이 시작되었습니다!' }];
                if (!docSnap.exists()) saveMemosToFirebase();
                renderMemos();
            });
        }

        async function saveTodosToFirebase() {
            const user = window.firebaseAuth.currentUser;
            if (user) await window.setDoc(window.doc(window.firebaseDb, 'users', user.uid, 'data', 'todos'), { items: todos });
        }

        async function saveMemosToFirebase() {
            const user = window.firebaseAuth.currentUser;
            if (user) await window.setDoc(window.doc(window.firebaseDb, 'users', user.uid, 'data', 'memos'), { items: memos });
        }

        document.getElementById('todo-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const input = document.getElementById('todo-input');
            const text = input.value.trim();
            if (!text) return;
            todos.unshift({ id: Date.now(), text, category: document.getElementById('todo-category').value, important: document.getElementById('todo-important').checked, completed: false });
            input.value = '';
            document.getElementById('todo-important').checked = false;
            saveTodosToFirebase();
        });

        function toggleTodo(id) { todos = todos.map(t => t.id === id ? { ...t, completed: !t.completed } : t); saveTodosToFirebase(); }
        function deleteTodo(id) { todos = todos.filter(t => t.id !== id); saveTodosToFirebase(); }

        function setFilter(filter) {
            currentFilter = filter;
            ['all', 'active', 'completed'].forEach(f => {
                document.getElementById(`filter-${f}`).className = `filter-btn px-2.5 py-1 rounded-lg transition-all ${f === filter ? 'bg-[#e3dad0] text-[#63554b] font-medium' : 'hover:bg-[#f0ebe1] text-[#8c7b6f]'}`;
            });
            renderTodos();
        }

        function renderTodos() {
            let filtered = todos;
            if (currentFilter === 'active') filtered = todos.filter(t => !t.completed);
            if (currentFilter === 'completed') filtered = todos.filter(t => t.completed);

            const total = todos.length, completedCount = todos.filter(t => t
